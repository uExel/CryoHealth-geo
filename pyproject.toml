[project]
name = "cryohealth-geo"
version = "0.1.0"
description = "Sentinel-2 glacial lake monitoring: NDWI water extent, cloud masking, hazard index"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0",
    "fastapi>=0.141.0",
    "httpx>=0.28.0",
    "numpy>=2.5.1",
    "planetary-computer>=1.0.0",
    "psycopg[binary]>=3.3.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.0",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]
ml = [
    # Optional: AlphaEarth embedding fetch + ONNX adapter inference (Issue #18).
    # Install with: uv pip install 'cryohealth-geo[ml]'
    # Base install and NDWI fallback are unaffected without this group.
    "earthengine-api>=0.1.390",
    "onnxruntime>=1.17.0",
    "scipy>=1.14.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that require real GEE credentials and/or ONNX weights (deselect with -m 'not slow')",
]
