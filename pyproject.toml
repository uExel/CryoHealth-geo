[project]
name = "cryohealth-geo"
version = "0.1.0"
description = "Sentinel-2 glacial lake monitoring: NDWI water extent, cloud masking, hazard index"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0",
    "fastapi>=0.141.0",
    "httpx>=0.28.0",
    "numpy>=2.5.1",
    "pandas>=2.2.0",
    "planetary-computer>=1.0.0",
    "psycopg[binary]>=3.3.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.0",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]
ml = [
    # Optional: AlphaEarth embedding fetch + ONNX adapter inference (Issue #18).
    # Install with: uv pip install 'cryohealth-geo[ml]'
    # Base install and NDWI fallback are unaffected without this group.
    "earthengine-api>=0.1.390",
    "onnxruntime>=1.17.0",
    "scipy>=1.14.0",
]
forecast = [
    # Optional: Prophet time-series forecasting for 14-day lake expansion prediction (Issue #21).
    # Install with: uv pip install 'cryohealth-geo[forecast]'
    # Note: prophet pulls pystan (C++ compiled) and holidays — significant install overhead.
    # pandas is a base dependency and does not need to be included here.
    # Base install, NDWI, SAR, AlphaEarth, and hazard scoring are unaffected without this group.
    "prophet>=1.1.6",
]
anomaly = [
    # Optional: Isolation Forest anomaly detection for moraine dam-face seepage (Issue #22).
    # Install with: uv pip install 'cryohealth-geo[anomaly]'
    # scikit-learn + joblib — ~50 MB install (much lighter than [forecast] or [ml]).
    # Base install, NDWI, hazard scoring, and forecast are unaffected without this group.
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]


[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that require real GEE credentials and/or ONNX weights (deselect with -m 'not slow')",
]
